spring.application.name=MDSERP
server.port=8181
spring.datasource.jdbcUrl=jdbc:sqlserver://186.28.243.188\\sqlfactory:63138;encrypt=false;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#user for Back-end apps connection with read and write permissions to MDSERP database
spring.datasource.username=Back
spring.datasource.password=${MDSERP_DB_PASSWORD:}
#second data source Solid Works PDM
spring.second-datasource.jdbcUrl = jdbc:sqlserver://186.28.243.189\\mdsswpdmpro:63139;encrypt=false
spring.second-datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#user for Back-end apps connection with read and write permissions to Solid Works PDM database
spring.second-datasource.username = Back
spring.second-datasource.password = ${PDM_DB_PASSWORD:}


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Relaciones lazy en lotes (evita N+1) y planes reutilizables para IN; los lee PersistenceSqlFactoryAutoConfiguration
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Compresion gzip de respuestas JSON grandes (listados de vistas)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

# =======================
# OAuth2 & JWT Configuration
# =======================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://erp.proelectricos.com/auth/realms/MDSERP
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://erp.proelectricos.com/auth/realms/MDSERP/protocol/openid-connect/certs

jwt.expiration=3600000
jwt.expected-issuer=https://erp.proelectricos.com/auth/realms/MDSERP

# =======================
# Security Configuration
# =======================
security-config.allowed-paths=/swagger-ui/**,/v3/api-docs/** 
security-config.cors.allowed-origins=https://erp.proelectricos.com,http://localhost:4300

# =======================
# Logging Configuration
# =======================
logging.file.name=logs/mdserp.log
logging.logback.rollingpolicy.file-name-pattern=logs/mdserp-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# =======================
# Bitrix24 Configuration
# =======================
# URL del webhook entrante de Bitrix24 (formato: https://{portal}.bitrix24.com/rest/{userId}/{token}/)
# Se toma de la variable de entorno BITRIX_WEBHOOK_URL para no versionar el token
# (si no está definida la app arranca igual, pero las llamadas a Bitrix fallarán).
# El webhook debe tener permiso sobre el scope "crm".
bitrix.webhook-url=${BITRIX_WEBHOOK_URL:}
# Timeouts del cliente HTTP hacia Bitrix24
bitrix.connect-timeout=5s
bitrix.read-timeout=30s

# =======================
# Conector BI Builder de Bitrix24 (POST /bi-connector/*; lee los mismos pedidos que GET /api/orderheader)
# =======================
# URL publica por la que Bitrix24 llega al backend (nginx de erp.proelectricos.com, sin tunel)
b24.app-public-base-url=${B24_APP_PUBLIC_BASE_URL:}
# Clave compartida que Bitrix24 envia en connection[key]; vacia = el conector rechaza todas las llamadas
b24.connector-key=${B24_CONNECTOR_KEY:}
# Dias hacia atras que devuelve /bi-connector/data cuando el filtro no trae rango de fecha_pedido
b24.connector-default-window-days=${B24_CONNECTOR_DEFAULT_WINDOW_DAYS:90}
# Portal de Bitrix24 al que se llama con el token de la app local (registro del conector BI)
b24.portal-url=${B24_PORTAL_URL:https://proelectricos.bitrix24.es}
# client_id ("local.xxxx") de la app local; si se define, la instalacion rechaza tokens de otras apps
b24.app.client-id=${B24_APP_CLIENT_ID:}
# Solo si el conector consumiera /api/orderheader por HTTP (no es el diseno elegido: se lee en proceso)
# Endpoint origen de los pedidos y credenciales del cliente "Bitrix" de Keycloak (client credentials)
local-source.url=${LOCAL_SOURCE_URL:}
local-source.token-url=${LOCAL_SOURCE_TOKEN_URL:}
local-source.client-id=${LOCAL_SOURCE_CLIENT_ID:}
local-source.client-secret=${LOCAL_SOURCE_CLIENT_SECRET:}

# =======================
# Chatbot (Gemini + Telegram) - solo lectura sobre ErpDb
# =======================
# Los secretos se toman de variables de entorno; en local también del archivo .env de la raíz
# del proyecto (formato CLAVE=valor, ignorado por git). En Docker se pasan con --env-file.
spring.config.import=optional:file:.env[.properties]
# Solo una instancia puede hacer long polling con el mismo token: activar con CHATBOT_ENABLED=true
chatbot.enabled=${CHATBOT_ENABLED:false}
chatbot.gemini.api-key=${GEMINI_API_KEY:}
chatbot.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
chatbot.gemini.max-tool-calls=30
# Menos razonamiento = respuestas mas rapidas (minimal, low, medium, high)
chatbot.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
# Una conversacion sin mensajes por este tiempo se reinicia (historial corto = respuestas mas rapidas)
chatbot.gemini.minutos-inactividad=30
chatbot.telegram.token=${TELEGRAM_BOT_TOKEN:}
# IDs de chat separados por coma; el bot le indica su ID a quien no esté autorizado
chatbot.telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
# Conexión propia del chatbot apuntando a ErpDb. Recomendado: usuario SQL con solo db_datareader en ErpDb
chatbot.database.url=${CHATBOT_DB_URL:jdbc:sqlserver://186.28.243.188\\sqlfactory:63138;encrypt=false;databaseName=ErpDb;applicationName=MDSERP-Chatbot}
chatbot.database.username=${CHATBOT_DB_USER:${spring.datasource.username}}
chatbot.database.password=${CHATBOT_DB_PASSWORD:${spring.datasource.password}}
chatbot.database.max-rows=200
chatbot.database.query-timeout-seconds=30
